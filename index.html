<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Student Application Manager</h1>
            <p>Register and manage student applications</p>
        </header>

        <!-- Student Registration Form -->
        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm" novalidate>

                <!-- Student Name -->
                <div class="form-group">
                    <label for="studentName">Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter student name"
                    >

                    <small class="error" id="studentNameError"></small>
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                    >

                    <small class="error" id="emailError"></small>
                </div>


                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="10 digit phone number"
                        maxlength="10"
                    >

                    <small class="error" id="phoneError"></small>
                </div>


                <!-- Date of Birth -->
                <div class="form-group">
                    <label for="dob">Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                    >

                    <small class="error" id="dobError"></small>
                </div>


                <!-- Gender -->
                <div class="form-group">

                    <label>Gender</label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <small class="error" id="genderError"></small>

                </div>


                <!-- Course -->
                <div class="form-group">

                    <label for="course">Course</label>

                    <select id="course" name="course">

                        <option value="">-- Select Course --</option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="UI/UX">
                            UI/UX
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="Data Analytics">
                            Data Analytics
                        </option>

                    </select>

                    <small class="error" id="courseError"></small>

                </div>


                <!-- Skills -->
                <div class="form-group">

                    <label>Skills</label>

                    <div class="checkbox-group">

                        <label>
                            <input
                                type="checkbox"
                                name="skills"
                                value="HTML"
                            >
                            HTML
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="skills"
                                value="CSS"
                            >
                            CSS
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="skills"
                                value="JavaScript"
                            >
                            JavaScript
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="skills"
                                value="Git"
                            >
                            Git
                        </label>

                    </div>

                    <small class="error" id="skillsError"></small>

                </div>


                <!-- About Student -->
                <div class="form-group">

                    <label for="about">About Student</label>

                    <textarea
                        id="about"
                        name="about"
                        rows="5"
                        placeholder="Write something about the student..."
                    ></textarea>

                    <small class="error" id="aboutError"></small>

                </div>


                <!-- Profile Photo -->
                <div class="form-group">

                    <label for="photo">Profile Photo</label>

                    <input
                        type="file"
                        id="photo"
                        name="photo"
                        accept="image/*"
                    >

                    <small class="error" id="photoError"></small>

                </div>


                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    Add Student
                </button>

            </form>

        </section>


        <!-- Student Count -->
        <section class="student-count-section">

            <h2 id="studentCount">
                Total Students: 0
            </h2>

        </section>


        <!-- Student Cards -->
        <section class="students-section">

            <h2>Registered Students</h2>

            <div
                id="studentContainer"
                class="student-container"
            >
                <!-- Student cards will be created using JavaScript -->
            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
